<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>احجز استشارتك | سالم العبري</title><link rel="icon" href="/favicon-32.png"><link rel="stylesheet" href="/assets/consultation.css"><link rel="stylesheet" href="/assets/booking-calendar.css"></head><body><nav><a href="/">سالم العبري · Salim Alabri</a><button id="lang">EN</button></nav><main><header><div class="consult-orb" aria-hidden="true">✦</div><p class="eyebrow" data-ar="خطوتك التالية تبدأ بفكرة واضحة" data-en="Your next step starts with clarity">خطوتك التالية تبدأ بفكرة واضحة</p><h1 data-ar="احجز استشارتك." data-en="Book your consultation.">احجز استشارتك.</h1><p data-ar="اختر يومك من التقويم، ثم الوقت المناسب، وأكمل بيانات الحجز." data-en="Choose a day from the calendar, select a time, then enter your booking details.">اختر يومك من التقويم، ثم الوقت المناسب، وأكمل بيانات الحجز.</p></header><p id="notice" role="status"></p><section aria-label="أنواع الاستشارات" id="types" class="type-grid"></section><section id="booking" hidden><h2 id="chosen"></h2><p data-ar="المواعيد بتوقيت سلطنة عُمان (مسقط)." data-en="Times are shown in Oman time (Muscat).">المواعيد بتوقيت سلطنة عُمان (مسقط).</p><div class="calendar-shell"><div id="calendar" class="calendar-panel"></div><div class="time-panel"><h3 id="dayHeading"></h3><div id="slots" class="time-options"></div></div></div><form id="form" hidden><h2 data-ar="بيانات الحجز" data-en="Booking details">بيانات الحجز</h2><p id="recap"></p><div class="fields"><label><span data-ar="الاسم" data-en="Name">الاسم</span><input name="name" autocomplete="name" required minlength="2" maxlength="100"></label><label><span data-ar="رقم الهاتف" data-en="Phone">رقم الهاتف</span><input name="phone" type="tel" autocomplete="tel" required maxlength="25"></label><label><span data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</span><input name="email" type="email" autocomplete="email" required maxlength="254"></label><label><span data-ar="ما الذي تريد مناقشته؟" data-en="What would you like to discuss?">ما الذي تريد مناقشته؟</span><textarea name="message" rows="3" maxlength="2000"></textarea></label></div><label class="consent"><input name="consent" type="checkbox" required><span data-ar="أوافق على حفظ بياناتي والتواصل معي بخصوص الحجز." data-en="I agree to storing my details and contacting me about this booking.">أوافق على حفظ بياناتي والتواصل معي بخصوص الحجز.</span></label><input name="website" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true"><p data-ar="الحجز لا يخصم أي مبلغ. يتم تنسيق طريقة اللقاء والدفع معك بعد الحجز." data-en="Booking does not charge you. Meeting and payment arrangements are coordinated after booking.">الحجز لا يخصم أي مبلغ. يتم تنسيق طريقة اللقاء والدفع معك بعد الحجز.</p><button id="submit" class="primary" data-ar="تأكيد الحجز" data-en="Confirm booking">تأكيد الحجز</button></form></section><section id="success" hidden role="status"><h2 data-ar="موعدك محجوز." data-en="Your time is booked.">موعدك محجوز.</h2><p id="receipt"></p><a href="/" data-ar="العودة إلى الموقع" data-en="Back to website">العودة إلى الموقع</a></section></main><script src="/assets/booking-calendar.js" defer></script><script src="/assets/consultation.js" defer></script></body></html>
